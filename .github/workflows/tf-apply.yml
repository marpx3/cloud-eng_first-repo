name: tf-apply
on: 
  push: 
    branches: [main] 

permissions: 
  id-token: write
  contents: read

concurrency:
  group: tf-apply
  cancel-in-progress: false

env:                        
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=selbsttest-01 init
      - run: terraform -chdir=selbsttest-01 apply -auto-approve -var-file=dev.tfvars

